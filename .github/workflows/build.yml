name: Build firmware

# Compiles base/core.yaml with the latest ESPHome release, so C++ and component
# schema errors show up on the push instead of at flash time.

on:
  push:
    branches: [main, beta, aec]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "skill/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "skill/**"
  workflow_dispatch:
    inputs:
      esphome_version:
        description: "ESPHome version to build with (empty = latest release)"
        required: false
        default: ""
      decode:
        description: "Crash addresses to resolve with addr2line after the build (space-separated)"
        required: false
        default: ""

# A newer push to a pull request supersedes the running build. Branch pushes
# always run to completion, so a commit never ends up marked as cancelled.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}-${{ inputs.esphome_version }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install "esphome${{ inputs.esphome_version && format('=={0}', inputs.esphome_version) || '' }}" pyyaml

      - name: Offline validation
        run: python scripts/validate.py base/core.yaml

      - name: Placeholder secrets
        run: cp secrets.example.yaml ci/secrets.yaml

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('base/core.yaml') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Compile
        run: esphome compile ci/build.yaml

      - name: Decode crash addresses
        if: ${{ inputs.decode != '' }}
        run: |
          elf=$(find . ~/.esphome -name firmware.elf 2>/dev/null | head -1)
          a2l=$(find ~ / -name 'xtensa-esp32s3-elf-addr2line' -o -name 'xtensa-esp-elf-addr2line' 2>/dev/null | head -1)
          echo "ELF: $elf"
          echo "addr2line: $a2l"
          "$a2l" -pfiaC -e "$elf" ${{ inputs.decode }}
